version: '3.8'

# ============================================
# Funcat 混合架构 - Docker Compose 配置
# ============================================

services:
  # ==========================================
  # PostgreSQL 主数据库
  # ==========================================
  postgres:
    image: postgres:13-alpine
    container_name: funcat-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: funcat
      POSTGRES_USER: funcat_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funcat_password_change_me}
      PGDATA: /var/lib/postgresql/data/pgdata

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      # 数据持久化
      - postgres_data:/var/lib/postgresql/data
      # 初始化SQL脚本
      - ./deployment/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./deployment/sql/init_data.sql:/docker-entrypoint-initdb.d/02-init_data.sql:ro
      # 自定义配置
      - ./deployment/config/postgresql.conf:/etc/postgresql/postgresql.conf:ro

    command: postgres -c config_file=/etc/postgresql/postgresql.conf

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U funcat_user -d funcat"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    networks:
      - funcat-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # Redis 缓存服务
  # ==========================================
  redis:
    image: redis:6-alpine
    container_name: funcat-redis
    restart: unless-stopped

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_password_change_me}
      --maxmemory ${REDIS_MAX_MEMORY:-2gb}
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
      --appendonly yes
      --appendfsync everysec

    ports:
      - "${REDIS_PORT:-6379}:6379"

    volumes:
      # 数据持久化
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    networks:
      - funcat-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ==========================================
  # InfluxDB 时序数据库 (可选)
  # ==========================================
  influxdb:
    image: influxdb:2.0-alpine
    container_name: funcat-influxdb
    restart: unless-stopped

    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD:-influxdb_password_change_me}
      DOCKER_INFLUXDB_INIT_ORG: funcat
      DOCKER_INFLUXDB_INIT_BUCKET: stock_data
      DOCKER_INFLUXDB_INIT_RETENTION: 30d
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_ADMIN_TOKEN:-my-super-secret-auth-token}

    ports:
      - "${INFLUXDB_PORT:-8086}:8086"

    volumes:
      # 数据持久化
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    networks:
      - funcat-network

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 可选服务，默认不启动
    profiles:
      - full

  # ==========================================
  # Funcat 选股服务 (Go)
  # ==========================================
  selector:
    build:
      context: ./funcat-go
      dockerfile: Dockerfile

    image: funcat/selector:2.0.0
    container_name: funcat-selector
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      # 数据库连接
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: funcat
      POSTGRES_USER: funcat_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funcat_password_change_me}

      # Redis连接
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password_change_me}

      # 数据源配置
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-your_tushare_token_here}

      # 日志级别
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # 时区
      TZ: Asia/Shanghai

    volumes:
      # 配置文件
      - ./deployment/config/selector.yaml:/app/config/selector.yaml:ro
      # 日志目录
      - selector_logs:/app/logs
      # 数据目录
      - selector_data:/app/data

    networks:
      - funcat-network

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==========================================
  # Funcat Web UI 服务 (涨跌停数据看板)
  # ==========================================
  webui:
    build:
      context: ./web-ui/backend
      dockerfile: Dockerfile

    image: funcat/webui:2.0.0
    container_name: funcat-webui
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: funcat
      POSTGRES_USER: funcat_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-funcat_password_change_me}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password_change_me}

      API_PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TZ: Asia/Shanghai

    ports:
      - "${WEBUI_PORT:-8080}:8080"

    networks:
      - funcat-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ==========================================
  # Nginx 反向代理 (可选)
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: funcat-nginx
    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"

    volumes:
      - ./deployment/config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/config/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx

    networks:
      - funcat-network

    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    # 可选服务
    profiles:
      - full

  # ==========================================
  # Prometheus 监控 (可选)
  # ==========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: funcat-prometheus
    restart: unless-stopped

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'

    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

    volumes:
      - ./deployment/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

    networks:
      - funcat-network

    profiles:
      - monitoring

  # ==========================================
  # Grafana 可视化 (可选)
  # ==========================================
  grafana:
    image: grafana/grafana:latest
    container_name: funcat-grafana
    restart: unless-stopped

    depends_on:
      - prometheus

    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-grafana_password_change_me}
      GF_INSTALL_PLUGINS: grafana-clock-panel

    ports:
      - "${GRAFANA_PORT:-3000}:3000"

    volumes:
      - grafana_data:/var/lib/grafana
      - ./deployment/config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deployment/config/grafana/datasources:/etc/grafana/provisioning/datasources:ro

    networks:
      - funcat-network

    profiles:
      - monitoring

# ============================================
# 网络配置
# ============================================
networks:
  funcat-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================
# 数据卷配置
# ============================================
volumes:
  # PostgreSQL数据
  postgres_data:
    driver: local

  # Redis数据
  redis_data:
    driver: local

  # InfluxDB数据
  influxdb_data:
    driver: local

  influxdb_config:
    driver: local

  # 选股服务
  selector_logs:
    driver: local

  selector_data:
    driver: local

  # Web UI服务
  webui_logs:
    driver: local

  # Nginx
  nginx_logs:
    driver: local

  # 监控数据
  prometheus_data:
    driver: local

  grafana_data:
    driver: local
