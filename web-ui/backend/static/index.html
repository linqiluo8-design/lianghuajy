<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funcat 涨跌停数据看板</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus@2.4.4/dist/index.css">
    <script src="https://unpkg.com/echarts@5.4.3/dist/echarts.min.js"></script>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .stat-value {
            font-size: 36px;
            font-weight: bold;
            margin: 10px 0;
        }
        .stat-label {
            color: #909399;
        }
        .panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
        }
        .panel-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #E4E7ED;
        }
        #chart {
            width: 100%;
            height: 400px;
        }
        .red { color: #F56C6C; }
        .green { color: #67C23A; }
        .blue { color: #409EFF; }
        .orange { color: #E6A23C; }
    </style>
</head>
<body>
    <div id="app" class="container">
        <div class="header">
            <h1>📊 Funcat 涨跌停数据看板</h1>
            <p>实时监控市场热点 · 板块涨停统计</p>
            <el-button type="primary" @click="loadData" style="margin-top: 10px;">🔄 刷新数据</el-button>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value red">{{ totalLimitUp }}</div>
                <div class="stat-label">涨停家数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value green">{{ totalLimitDown }}</div>
                <div class="stat-label">跌停家数</div>
            </div>
            <div class="stat-card">
                <div class="stat-value blue">{{ totalOneWord }}</div>
                <div class="stat-label">一字涨停</div>
            </div>
            <div class="stat-card">
                <div class="stat-value orange">{{ totalBroken }}</div>
                <div class="stat-label">炸板总数</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-title">📊 板块涨停排行</div>
            <div id="chart"></div>
        </div>

        <div class="panel">
            <div class="panel-title">🔥 板块强度排行（日期: {{ selectedDate }}）</div>
            <el-table :data="sectorStrength" stripe style="width: 100%">
                <el-table-column type="index" label="排名" width="60"></el-table-column>
                <el-table-column prop="sector_name" label="板块名称" width="120"></el-table-column>
                <el-table-column prop="strength_grade" label="等级" width="80"></el-table-column>
                <el-table-column label="强度分数" width="110">
                    <template v-slot="scope">
                        <span class="orange" style="font-weight: bold;">
                            {{ safeFixed(scope.row.strength_score, 1) }}
                        </span>
                    </template>
                </el-table-column>
                <el-table-column prop="limit_up_count" label="涨停数" width="90"></el-table-column>
                <el-table-column prop="one_word_count" label="一字板" width="90"></el-table-column>
                <el-table-column label="平均涨幅%" width="110">
                    <template v-slot="scope">
                        <span class="red">{{ safeFixed(scope.row.avg_change_pct, 2) }}%</span>
                    </template>
                </el-table-column>
            </el-table>
        </div>
    </div>

    <script src="https://unpkg.com/vue@3.3.11/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus@2.4.4/dist/index.full.js"></script>

    <script>
        const { createApp } = Vue;
        const app = createApp({
            data() {
                return {
                    selectedDate: '2025-12-30',
                    sectorStats: [],
                    sectorStrength: [],
                    totalLimitUp: 0,
                    totalLimitDown: 0,
                    totalOneWord: 0,
                    totalBroken: 0,
                    chart: null
                };
            },
            mounted() {
                console.log('✅ Vue 应用已挂载');
                this.loadData();
            },
            methods: {
                async loadData() {
                    console.log('🔄 开始加载数据...');
                    try {
                        await this.loadSectorStats();
                        await this.loadSectorStrength();
                        this.renderChart();
                    } catch (error) {
                        console.error('❌ 加载数据失败:', error);
                        window['element-plus'].ElMessage.error('加载数据失败');
                    }
                },

                async loadSectorStats() {
                    const response = await fetch(`/api/v1/sectors/stats?date=${this.selectedDate}`);
                    const result = await response.json();
                    console.log('📊 板块统计:', result);

                    if (result.code === 200 && Array.isArray(result.data)) {
                        this.sectorStats = result.data;
                        this.totalLimitUp = this.sectorStats.reduce((s, v) => s + (v.limit_up_count || 0), 0);
                        this.totalLimitDown = this.sectorStats.reduce((s, v) => s + (v.limit_down_count || 0), 0);
                        this.totalOneWord = this.sectorStats.reduce((s, v) => s + (v.one_word_count || 0), 0);
                        this.totalBroken = this.sectorStats.reduce((s, v) => s + (v.broken_count || 0), 0);
                    }
                },

                async loadSectorStrength() {
                    const response = await fetch(`/api/v1/sector-strength?date=${this.selectedDate}&limit=20`);
                    const result = await response.json();
                    console.log('🔥 板块强度:', result);

                    if (result.code === 200 && Array.isArray(result.data)) {
                        this.sectorStrength = result.data;
                    }
                },

                renderChart() {
                    if (!this.sectorStats || this.sectorStats.length === 0) return;

                    if (!this.chart) {
                        this.chart = echarts.init(document.getElementById('chart'));
                    }

                    const top10 = this.sectorStats.slice(0, 10);
                    const option = {
                        tooltip: { trigger: 'axis' },
                        legend: { data: ['涨停', '一字板', '炸板'] },
                        grid: { left: '3%', right: '4%', bottom: '3%', containLabel: true },
                        xAxis: { type: 'value' },
                        yAxis: { type: 'category', data: top10.map(s => s.sector_name || '') },
                        series: [
                            { name: '涨停', type: 'bar', data: top10.map(s => s.limit_up_count || 0), itemStyle: { color: '#F56C6C' } },
                            { name: '一字板', type: 'bar', data: top10.map(s => s.one_word_count || 0), itemStyle: { color: '#E6A23C' } },
                            { name: '炸板', type: 'bar', data: top10.map(s => s.broken_count || 0), itemStyle: { color: '#909399' } }
                        ]
                    };
                    this.chart.setOption(option);
                    console.log('✅ 图表渲染成功');
                },

                safeFixed(value, digits) {
                    if (value == null || value === undefined || isNaN(value)) return '-';
                    return Number(value).toFixed(digits);
                }
            }
        });

        app.config.errorHandler = (err) => {
            console.error('❌ Vue 错误:', err);
        };

        app.use(window['element-plus']);
        app.mount('#app');
        console.log('🎉 应用启动成功');
    </script>
</body>
</html>
