# ============================================
# PostgreSQL 配置文件 (针对Docker环境优化)
# ============================================

# ============================================
# 连接设置
# ============================================
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3

# ============================================
# 内存配置
# ============================================
shared_buffers = 2GB                    # 共享缓冲区 (推荐: 系统内存的25%)
effective_cache_size = 6GB              # 有效缓存大小 (推荐: 系统内存的50-75%)
maintenance_work_mem = 512MB            # 维护操作内存
work_mem = 128MB                        # 单个查询操作内存

# ============================================
# WAL (Write-Ahead Log) 配置
# ============================================
wal_level = replica                     # WAL级别
wal_buffers = 16MB                      # WAL缓冲区
min_wal_size = 1GB
max_wal_size = 4GB
checkpoint_completion_target = 0.9      # 检查点完成目标
wal_compression = on                    # WAL压缩

# ============================================
# 查询优化
# ============================================
random_page_cost = 1.1                  # SSD优化
effective_io_concurrency = 200          # SSD并发I/O
default_statistics_target = 100

# ============================================
# 日志配置
# ============================================
logging_collector = on
log_destination = 'stderr'
log_directory = 'pg_log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000       # 记录超过1秒的查询
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0

# ============================================
# 慢查询日志
# ============================================
log_statement = 'none'                  # none, ddl, mod, all
log_duration = off

# ============================================
# 自动清理 (Autovacuum)
# ============================================
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min

# ============================================
# 客户端连接
# ============================================
client_encoding = UTF8
timezone = 'Asia/Shanghai'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# ============================================
# 性能优化
# ============================================
shared_preload_libraries = 'pg_stat_statements'
max_parallel_workers_per_gather = 2
max_worker_processes = 8
max_parallel_workers = 8

# ============================================
# 锁超时
# ============================================
deadlock_timeout = 1s
lock_timeout = 0
statement_timeout = 0
idle_in_transaction_session_timeout = 0
